<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pishi · Crossword</title>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#F4A63B">
<link rel="apple-touch-icon" href="../icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { font-family:'Trebuchet MS',Tahoma,sans-serif; background:#FFF8EC; color:#333;
    display:-webkit-flex; display:flex; -webkit-flex-direction:column; flex-direction:column;
    -webkit-user-select:none; user-select:none; }
  .fa { direction:rtl; }
  #errbar { display:none; background:#C62828; color:#fff; font-size:12px; padding:6px 10px; direction:ltr; }
  header { background:#F4A63B; color:#fff; padding:9px 14px; display:-webkit-flex; display:flex;
    -webkit-align-items:center; align-items:center; }
  header .t { font-size:18px; font-weight:bold; margin-left:9px; }
  header .s { font-size:11px; opacity:.92; margin-left:auto; text-align:right; }
  main { -webkit-flex:1; flex:1; overflow-y:auto; padding:12px; }
  .wrap { max-width:560px; margin:0 auto; }

  .pickrow { margin-bottom:11px; }
  .pickrow .lab { font-size:12.5px; color:#a89a80; margin-bottom:5px; }
  .chips { display:-webkit-flex; display:flex; -webkit-flex-wrap:wrap; flex-wrap:wrap; }
  .chip { background:#fff; border:2px solid #eee; border-radius:11px; padding:6px 10px; margin:0 5px 5px 0;
    font-size:13px; font-family:inherit; color:#666; }
  .chip.on { border-color:#F4A63B; background:#FFF3DC; color:#333; font-weight:bold; }
  .lvl { display:-webkit-flex; display:flex; }
  .lvl button { -webkit-flex:1; flex:1; background:#fff; border:2px solid #eee; border-radius:12px;
    margin:0 4px 0 0; padding:7px 2px; font-family:inherit; text-align:center; }
  .lvl button:last-child { margin-right:0; }
  .lvl button.on { border-color:#F4A63B; background:#FFF3DC; }
  .lvl .n { display:block; font-size:15px; font-weight:bold; color:#F4A63B; }
  .lvl .st { display:block; font-size:8.5px; color:#c8b89c; letter-spacing:-1px; }
  .lvl .kind { display:block; font-size:8.5px; color:#bbb; }

  .bar { display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; margin:10px 0 8px; }
  .bar .prog { -webkit-flex:1; flex:1; font-size:14px; font-weight:bold; color:#666; }
  .btn { background:#F4A63B; color:#fff; border:0; border-radius:11px; padding:9px 14px;
    font-size:14px; font-weight:bold; font-family:inherit; box-shadow:0 3px 0 #d78e26; }
  .btn:active { -webkit-transform:translateY(2px); transform:translateY(2px); box-shadow:none; }
  .btn.ghost { background:#fff; color:#F4A63B; border:2px solid #F4A63B; box-shadow:none; margin-left:6px; }

  #board { background:#fff; border-radius:16px; box-shadow:0 3px 10px rgba(0,0,0,.08);
    padding:9px; margin-bottom:12px; overflow-x:auto; }
  table { border-collapse:collapse; margin:0 auto; }
  td { padding:0; }
  .cell { position:relative; border:1.5px solid #ddd; background:#fff; text-align:center;
    font-weight:bold; color:#333; border-radius:3px; }
  .cell.blank { border:0; background:transparent; }
  .cell.cur { background:#FFE0A8; border-color:#F4A63B; }
  .cell.word { background:#FFF3DC; }
  .cell.ok { background:#C8E6C9; color:#2E7D32; }
  .cell .num { position:absolute; top:0px; left:2px; font-size:8px; color:#bbb; font-weight:normal; }
  .cell .given { color:#F4A63B; }

  #hiddenIn { position:absolute; opacity:0; height:1px; width:1px; border:0; padding:0; }

  .clues { margin-top:4px; }
  .clue { background:#fff; border-radius:12px; padding:9px 11px; margin-bottom:7px;
    box-shadow:0 2px 6px rgba(0,0,0,.06); display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; }
  .clue.on { border:2px solid #F4A63B; }
  .clue.solved { background:#F1F8F1; }
  .clue .no { font-weight:bold; color:#F4A63B; font-size:14px; width:34px; flex:none; }
  .clue .art { width:46px; flex:none; text-align:center; }
  .clue .art svg { width:40px; height:40px; }
  .clue .txt { -webkit-flex:1; flex:1; font-size:14px; color:#555; line-height:1.6; }
  .clue .txt .fa { font-size:13px; color:#888; }
  .clue .spk { font-size:15px; opacity:.45; padding:0 4px; }
  .clue .dir { font-size:10px; color:#c8b89c; margin-left:5px; }

  #win { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(255,248,236,.97);
    display:none; text-align:center; padding-top:22%; z-index:20; }
  #win.show { display:block; }
  #win .cup { font-size:74px; }
  #win h2 { font-size:25px; color:#F4A63B; margin:8px 0 4px; }
  #win p { font-size:14px; color:#888; margin-bottom:16px; }
  #win .btn { margin:0 4px; }
  .note { font-size:12px; color:#b4a68e; text-align:center; margin:8px 0 4px; line-height:1.8; }
</style>
</head>
<body>
<div id="errbar"></div>
<header>
  <svg width="34" height="34" viewBox="0 0 200 200"><ellipse cx="100" cy="150" rx="46" ry="38" fill="#fff" opacity=".9"/><circle cx="100" cy="82" r="44" fill="#fff"/><path d="M66 52 L60 22 L88 42 Z" fill="#fff"/><path d="M134 52 L140 22 L112 42 Z" fill="#fff"/><circle cx="84" cy="78" r="7" fill="#F4A63B"/><circle cx="116" cy="78" r="7" fill="#F4A63B"/><path d="M96 92 q4 4 8 0" stroke="#F4A63B" stroke-width="4" fill="none"/></svg>
  <div class="t">Crossword</div>
  <div class="s fa">جدول کلمات متقاطع<br>بدون اینترنت</div>
</header>

<main><div class="wrap">
  <div class="pickrow">
    <div class="lab fa">۱) موضوع</div>
    <div class="chips" id="topics"></div>
  </div>
  <div class="pickrow">
    <div class="lab fa">۲) سطح — سطح ۱ و ۲ با تصویر است (خواندن لازم نیست)</div>
    <div class="lvl" id="levels"></div>
  </div>

  <div class="bar">
    <div class="prog fa" id="prog">—</div>
    <button class="btn" id="newBtn"><span class="fa">جدول تازه</span> 🔄</button>
    <button class="btn ghost" id="hintBtn">💡</button>
  </div>

  <div id="board"></div>
  <input id="hiddenIn" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
  <p class="note fa">روی خانه بزن و حرف را تایپ کن. روی 🔊 بزن تا کلمه را بشنوی.</p>
  <div class="clues" id="clues"></div>
</div></main>

<div id="win">
  <div class="cup">🏆</div>
  <h2 class="fa">عالی بود!</h2>
  <p class="fa" id="wintxt"></p>
  <button class="btn" id="againBtn"><span class="fa">یکی دیگر</span> 🔄</button>
  <button class="btn ghost" id="upBtn"><span class="fa">سطح بالاتر</span> ⬆</button>
</div>

<script>
window.onerror=function(m,s,l){var b=document.getElementById('errbar');if(b){b.style.display='block';b.textContent='error: '+m+' @'+l;}return false;};
</script>

<script>
(function(){
  // levels: word count + clue style
  //  pic  = picture clue only (pre-readers)
  //  picL = picture + first letter given
  //  fa   = Persian word clue
  //  en   = English sentence clue
  //  def  = English definition clue (adult level)
  var LEVELS=[
    {n:1, words:4,  clue:'picL', stars:'★☆☆☆☆', kind:'تصویر'},
    {n:2, words:5,  clue:'pic',  stars:'★★☆☆☆', kind:'تصویر'},
    {n:3, words:6,  clue:'fa',   stars:'★★★☆☆', kind:'فارسی'},
    {n:4, words:8,  clue:'en',   stars:'★★★★☆', kind:'جمله'},
    {n:5, words:10, clue:'def',  stars:'★★★★★', kind:'تعریف'}
  ];

  var topic=0, level=0, entries=[], gridW=0, gridH=0, cells={}, cur=null, curEntry=null, hintUsed=0, player=null;
  function $(id){return document.getElementById(id);}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function play(w){ var k=w.toLowerCase(); if(typeof AUDIO==='undefined'||!AUDIO[k])return;
    try{if(player){try{player.pause();}catch(e){}} player=new Audio(AUDIO[k]); player.play();}catch(e){} }

  function buildPickers(){
    var t=$('topics'); t.innerHTML='';
    for(var i=0;i<TOPICS.length;i++){(function(i){
      var b=document.createElement('button'); b.className='chip'+(i===0?' on':'');
      b.innerHTML=TOPICS[i].icon+' <span class="fa">'+TOPICS[i].fa+'</span>';
      b.onclick=function(){topic=i;mark(t,i,'chip');newPuzzle();}; t.appendChild(b);})(i);}
    var l=$('levels'); l.innerHTML='';
    for(var j=0;j<LEVELS.length;j++){(function(j){
      var b=document.createElement('button'); b.className=(j===0?'on':'');
      b.innerHTML='<span class="n">'+LEVELS[j].n+'</span><span class="st">'+LEVELS[j].stars+'</span><span class="kind fa">'+LEVELS[j].kind+'</span>';
      b.onclick=function(){level=j;mark(l,j,'');newPuzzle();}; l.appendChild(b);})(j);}
  }
  function mark(p,idx,base){ var k=p.children; for(var i=0;i<k.length;i++) k[i].className=base+(i===idx?(base?' on':'on'):''); }

  // ---------- crossword layout (greedy intersection) ----------
  function buildLayout(words){
    var placed=[];
    var occ={};           // "r,c" -> letter
    function get(r,c){ return occ[r+','+c]; }
    function fits(word,r,c,horiz){
      for(var i=0;i<word.length;i++){
        var rr=horiz?r:r+i, cc=horiz?c+i:c;
        var here=get(rr,cc);
        if(here && here!==word.charAt(i)) return false;
        if(!here){
          // no touching parallel neighbours
          if(horiz){ if(get(rr-1,cc)||get(rr+1,cc)) return false; }
          else { if(get(rr,cc-1)||get(rr,cc+1)) return false; }
        }
      }
      // ends must be clear
      if(horiz){ if(get(r,c-1)||get(r,c+word.length)) return false; }
      else { if(get(r-1,c)||get(r+word.length,c)) return false; }
      return true;
    }
    function put(word,r,c,horiz){
      var cs=[];
      for(var i=0;i<word.length;i++){
        var rr=horiz?r:r+i, cc=horiz?c+i:c;
        occ[rr+','+cc]=word.charAt(i); cs.push([rr,cc]);
      }
      placed.push({word:word,r:r,c:c,horiz:horiz,cells:cs});
    }
    // first word horizontal at origin
    put(words[0],0,0,true);
    for(var w=1;w<words.length;w++){
      var word=words[w], done=false;
      for(var p=0;p<placed.length && !done;p++){
        var pl=placed[p];
        for(var i=0;i<pl.word.length && !done;i++){
          for(var j=0;j<word.length && !done;j++){
            if(pl.word.charAt(i)!==word.charAt(j)) continue;
            var horiz=!pl.horiz;
            var r,c;
            if(horiz){ r=pl.r+i; c=pl.c-j; } else { r=pl.r-j; c=pl.c+i; }
            if(fits(word,r,c,horiz)){ put(word,r,c,horiz); done=true; }
          }
        }
      }
    }
    // normalise coords
    var minR=999,minC=999,maxR=-999,maxC=-999;
    for(var k in occ){ var pr=k.split(','), rr=+pr[0], cc=+pr[1];
      if(rr<minR)minR=rr; if(cc<minC)minC=cc; if(rr>maxR)maxR=rr; if(cc>maxC)maxC=cc; }
    for(var q=0;q<placed.length;q++){
      placed[q].r-=minR; placed[q].c-=minC;
      for(var m=0;m<placed[q].cells.length;m++){ placed[q].cells[m][0]-=minR; placed[q].cells[m][1]-=minC; }
    }
    return {placed:placed, w:maxC-minC+1, h:maxR-minR+1};
  }

  function newPuzzle(){
    var L=LEVELS[level], T=TOPICS[topic];
    hintUsed=0; cur=null; curEntry=null;
    var pool=T.words.slice();
    if(L.words>pool.length){ for(var i=0;i<TOPICS.length;i++) if(i!==topic) pool=pool.concat(TOPICS[i].words); }
    pool=pool.filter(function(w){return w.length>=3 && w.length<=10;});
    // longest-first improves intersection quality
    var best=null;
    for(var attempt=0;attempt<8;attempt++){
      shuffle(pool);
      var pick=pool.slice(0,Math.min(L.words,pool.length));
      pick.sort(function(a,b){return b.length-a.length;});
      var up=[]; for(var k=0;k<pick.length;k++) up.push(pick[k].toUpperCase());
      var lay=buildLayout(up);
      if(!best || lay.placed.length>best.placed.length) best=lay;
      if(best.placed.length>=Math.min(L.words,pick.length)) break;
    }
    entries=best.placed; gridW=best.w; gridH=best.h;
    // number the entries by grid position
    entries.sort(function(a,b){ return (a.r-b.r)||(a.c-b.c); });
    for(var e=0;e<entries.length;e++){ entries[e].no=e+1; entries[e].guess=[];
      for(var g=0;g<entries[e].word.length;g++) entries[e].guess.push(''); }
    // pre-fill first letters on level 1
    if(L.clue==='picL'){
      for(var f=0;f<entries.length;f++){ entries[f].guess[0]=entries[f].word.charAt(0); entries[f].given=true; }
    }
    render();
  }

  function letterAt(r,c){
    for(var i=0;i<entries.length;i++){
      var e=entries[i];
      for(var j=0;j<e.cells.length;j++) if(e.cells[j][0]===r && e.cells[j][1]===c) return {e:e,idx:j};
    }
    return null;
  }
  function valueAt(r,c){
    for(var i=0;i<entries.length;i++){ var e=entries[i];
      for(var j=0;j<e.cells.length;j++) if(e.cells[j][0]===r&&e.cells[j][1]===c && e.guess[j]) return e.guess[j]; }
    return '';
  }
  function setValue(r,c,ch){
    for(var i=0;i<entries.length;i++){ var e=entries[i];
      for(var j=0;j<e.cells.length;j++) if(e.cells[j][0]===r&&e.cells[j][1]===c) e.guess[j]=ch; }
  }

  function render(){
    var sz=Math.max(20, Math.min(34, Math.floor(330/Math.max(gridW,1))));
    var map={};
    for(var i=0;i<entries.length;i++){ var e=entries[i];
      for(var j=0;j<e.cells.length;j++){ var key=e.cells[j][0]+','+e.cells[j][1];
        if(!map[key]) map[key]={r:e.cells[j][0],c:e.cells[j][1],nos:[]};
        if(j===0) map[key].nos.push(e.no);
      } }
    var html='<table>';
    for(var r=0;r<gridH;r++){
      html+='<tr>';
      for(var c=0;c<gridW;c++){
        var k=r+','+c, m=map[k];
        if(!m){ html+='<td><div class="cell blank" style="width:'+sz+'px;height:'+sz+'px"></div></td>'; continue; }
        var v=valueAt(r,c);
        html+='<td><div class="cell" id="k'+r+'_'+c+'" data-r="'+r+'" data-c="'+c+'" style="width:'+sz+'px;height:'+sz+'px;line-height:'+sz+'px;font-size:'+Math.floor(sz*0.55)+'px">'
            +(m.nos.length?'<span class="num">'+m.nos.join('/')+'</span>':'')+v+'</div></td>';
      }
      html+='</tr>';
    }
    html+='</table>';
    $('board').innerHTML=html;
    attachCells();
    renderClues();
    updateProg(true);
    $('win').className='';
  }

  function renderClues(){
    var L=LEVELS[level], T=TOPICS[topic], h='';
    for(var i=0;i<entries.length;i++){
      var e=entries[i], w=e.word.toLowerCase(), meta=(WORDS[w]||{});
      var solved=isSolved(e);
      var art = (L.clue==='pic'||L.clue==='picL') && meta.svg ? '<div class="art">'+meta.svg+'</div>' : '';
      var txt='';
      if(L.clue==='pic'||L.clue==='picL') txt='<span class="fa">'+(meta.fa||'')+'</span>';
      else if(L.clue==='fa') txt='<span class="fa">'+(meta.fa||'؟')+'</span>';
      else if(L.clue==='en') txt=(meta.en||('… '+e.word.length+' letters'));
      else txt=(meta.def||meta.en||('… '+e.word.length+' letters'));
      h+='<div class="clue'+(solved?' solved':'')+'" data-i="'+i+'">'
        +'<span class="no">'+e.no+'<span class="dir">'+(e.horiz?'→':'↓')+'</span></span>'
        +art+'<span class="txt">'+txt+'</span>'
        +'<span class="spk" data-w="'+w+'">🔊</span></div>';
    }
    $('clues').innerHTML=h;
    var els=$('clues').children;
    for(var j=0;j<els.length;j++){(function(el){
      el.onclick=function(ev){
        var t=ev.target;
        if(t.className==='spk'){ play(t.getAttribute('data-w')); return; }
        var e=entries[parseInt(el.getAttribute('data-i'),10)];
        focusCell(e.cells[0][0], e.cells[0][1], e);
      };
    })(els[j]);}
  }

  function isSolved(e){
    for(var i=0;i<e.word.length;i++) if(e.guess[i]!==e.word.charAt(i)) return false;
    return true;
  }
  function updateProg(quiet){
    var n=0; for(var i=0;i<entries.length;i++) if(isSolved(entries[i])) n++;
    $('prog').textContent=n+' از '+entries.length;
    // paint solved
    for(var j=0;j<entries.length;j++){
      var e=entries[j], ok=isSolved(e);
      for(var k=0;k<e.cells.length;k++){
        var el=$('k'+e.cells[k][0]+'_'+e.cells[k][1]);
        if(el && ok && el.className.indexOf('cur')<0) el.className='cell ok';
      }
    }
    if(!quiet && n===entries.length && entries.length>0) setTimeout(win,300);
  }

  function focusCell(r,c,ent){
    var prev=$('board').getElementsByClassName('cell');
    for(var i=0;i<prev.length;i++){ if(prev[i].className.indexOf('cur')>=0) prev[i].className='cell'; }
    cur=[r,c];
    var la=letterAt(r,c);
    curEntry = ent || (la?la.e:null);
    var el=$('k'+r+'_'+c);
    if(el) el.className='cell cur';
    updateProg(true);
    var inp=$('hiddenIn'); inp.value=''; inp.focus();
  }
  function attachCells(){
    var els=$('board').getElementsByClassName('cell');
    for(var i=0;i<els.length;i++){(function(el){
      if(el.className.indexOf('blank')>=0) return;
      el.onclick=function(){ focusCell(parseInt(el.getAttribute('data-r'),10), parseInt(el.getAttribute('data-c'),10)); };
    })(els[i]);}
  }
  function advance(){
    if(!curEntry||!cur) return;
    for(var i=0;i<curEntry.cells.length;i++){
      if(curEntry.cells[i][0]===cur[0] && curEntry.cells[i][1]===cur[1]){
        if(i+1<curEntry.cells.length) focusCell(curEntry.cells[i+1][0], curEntry.cells[i+1][1], curEntry);
        return;
      }
    }
  }
  $('hiddenIn').oninput=function(){
    var v=this.value.toUpperCase().replace(/[^A-Z]/g,'');
    this.value='';
    if(!v||!cur) return;
    var ch=v.charAt(v.length-1);
    setValue(cur[0],cur[1],ch);
    var el=$('k'+cur[0]+'_'+cur[1]);
    if(el){ var num=el.getElementsByClassName('num')[0];
      el.innerHTML=(num?num.outerHTML:'')+ch; el.className='cell cur'; }
    updateProg(false); renderClues(); advance();
  };
  $('hiddenIn').onkeydown=function(e){
    if(e.keyCode===8 && cur){ setValue(cur[0],cur[1],''); var el=$('k'+cur[0]+'_'+cur[1]);
      if(el){ var num=el.getElementsByClassName('num')[0]; el.innerHTML=(num?num.outerHTML:''); }
      updateProg(true); renderClues(); }
  };

  function hint(){
    for(var i=0;i<entries.length;i++){
      var e=entries[i];
      if(isSolved(e)) continue;
      for(var j=0;j<e.word.length;j++){
        if(e.guess[j]!==e.word.charAt(j)){
          e.guess[j]=e.word.charAt(j); hintUsed++;
          play(e.word);
          render();
          return;
        }
      }
    }
  }
  function win(){
    $('win').className='show';
    $('wintxt').innerHTML='سطح '+LEVELS[level].n+' · '+entries.length+' کلمه'+(hintUsed?' · '+hintUsed+' راهنما':'');
  }

  $('newBtn').onclick=newPuzzle;
  $('hintBtn').onclick=hint;
  $('againBtn').onclick=function(){$('win').className='';newPuzzle();};
  $('upBtn').onclick=function(){$('win').className='';if(level<LEVELS.length-1){level++;mark($('levels'),level,'');}newPuzzle();};

  buildPickers();
  newPuzzle();
})();
</script>
<script>if(navigator.serviceWorker){try{window.addEventListener("load",function(){navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(function(e){})})}catch(e){}}</script>
